[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "npc-forge"
version = "1.0.0"
description = "Production-ready NPC-Forge Engine Framework"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "Flask>=3.0.3",
    "flask-cors>=4.0.1",
    "Werkzeug>=3.0.3",
    "itsdangerous>=2.2.0",
    "click>=8.4.2",
    "Blinker>=1.8.2"
]

[tool.setuptools]
py-modules = ["cli", "server", "server_openai", "registry", "FlintNPC", "FlintParser", "compile_npc", "logger"]