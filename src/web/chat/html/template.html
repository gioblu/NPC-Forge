<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta id="theme-color-meta" name="theme-color" content="#04090b">
    <title>{{NPC_NAME}} - Standalone Chat</title>
    <style>
        /*{{STYLE_SOURCE}}*/

        /* ── top bar actions ── */
        .top-bar-actions { display: flex; gap: .5rem; align-items: center; }
        .voice-volume {
            display: none; align-items: center; gap: .4rem;
            padding: .2rem .5rem; border: var(--border); border-radius: var(--radius);
            background: var(--field);
        }
        .voice-volume input[type=range] { width: 90px; accent-color: var(--intro); }
        .voice-volume span { font-size: .7rem; color: var(--text-dim); min-width: 2.6em; text-align: right; }
        button:disabled { opacity: .45; cursor: not-allowed; }

        /* ── dataset panel ── */
        .dataset-panel {
            position: fixed; top: 4rem; right: 1rem; width: 320px;
            max-width: calc(100vw - 2rem); background: var(--panel);
            border: var(--border-strong); border-radius: var(--radius);
            box-shadow: 0 8px 24px rgba(0,0,0,.4); z-index: 1000; padding: 1rem;
            display: flex; flex-direction: column; gap: .75rem;
        }
        .dataset-panel-header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: var(--border); padding-bottom: .5rem;
        }
        .dataset-panel-header h4 { margin: 0; font-size: .95rem; color: var(--heading); font-weight: 650; }
        .dataset-list { display: flex; flex-direction: column; gap: .75rem; max-height: 60vh; overflow-y: auto; padding-right: .25rem; }
        .dataset-item { padding: .75rem; border: var(--border); border-radius: var(--radius); background: var(--field); transition: border-color .18s ease; }
        .dataset-item:hover { border: var(--border-strong); }
        .dataset-item h5 { margin: 0 0 .25rem; font-size: .7em; color: var(--heading); display: flex; justify-content: space-between; align-items: center; }
        .dataset-item p { margin: 0 0 .75rem; font-size: .8rem; color: var(--text-dim); line-height: 1.4; }
        .dataset-item button { width: 100%; font-size: .8rem; padding: .4rem; }
        .dataset-item button.btn-download { background: var(--primary-background); border: var(--primary-border); color: var(--primary-text); }
        .dataset-item button.btn-download:hover { background: var(--primary-hover); }
        .dataset-item button.btn-remove { background: rgba(229,83,75,.1); border: 1px solid rgba(229,83,75,.3); color: var(--user); }
        .dataset-item button.btn-remove:hover { background: rgba(229,83,75,.2); border: 1px solid rgba(229,83,75,.5); }
        .dataset-msg { font-size: .75rem; margin-top: .5rem; text-align: center; min-height: 1rem; }
        .dataset-msg.success { color: var(--green); }
        .dataset-msg.error { color: var(--user); }

        /* ── loading popup ── */
        .loading-popup {
            position: fixed; inset: 0; background: rgba(0,0,0,.75);
            display: flex; justify-content: center; align-items: center;
            z-index: 9999; backdrop-filter: blur(4px);
        }
        .loading-content {
            background: var(--panel, #1a1b1e); padding: 2rem; border-radius: var(--radius, 8px);
            border: 1px solid var(--border-strong, #333); width: 320px; text-align: center;
            box-shadow: 0 8px 32px rgba(0,0,0,.5);
        }
        .loading-content h4 { margin: 0 0 1rem; color: var(--heading, #fff); font-size: 1.1rem; }
        .progress-bar-container { width: 100%; height: 8px; background: var(--field, #2a2a2a); border-radius: 4px; overflow: hidden; margin-top: .5rem; }
        .progress-bar { height: 100%; background: var(--primary-background, #4caf50); transition: width .3s ease; border-radius: 4px; }
        .loading-status { font-size: .85rem; color: var(--text-dim, #aaa); margin-top: 1rem; min-height: 1.2em; }

        /* ── markdown ── */
        .markdown-body { line-height: 1.6; }
        .markdown-body p { margin: .5em 0; }
        .markdown-body p:first-child { margin-top: 0; }
        .markdown-body p:last-child { margin-bottom: 0; }
        .markdown-body a { color: var(--intro); text-decoration: underline; text-underline-offset: .15em; }
        .markdown-body code { background: var(--field); padding: .2em .4em; border-radius: 4px; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: .9em; color: var(--text); }
        .markdown-body pre { background: var(--field); padding: .8rem; border-radius: var(--radius); overflow-x: auto; border: var(--border); margin: .5em 0; }
        .markdown-body pre code { background: transparent; padding: 0; font-size: .85rem; color: var(--text); }
        .markdown-body ul, .markdown-body ol { margin: .5em 0; padding-left: 1.5em; }
        .markdown-body strong { color: var(--heading); font-weight: 650; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body>
    <div id="loading-popup" class="loading-popup" style="display:none;">
        <div class="loading-content">
            <h4 id="loading-title">Loading Dataset...</h4>
            <div class="progress-bar-container">
                <div id="loading-progress" class="progress-bar" style="width:0%;"></div>
            </div>
            <p id="loading-status" class="loading-status">Initializing...</p>
        </div>
    </div>

    <div class="top-bar">
        <h3>NPC-Forge Chat</h3>
        <div class="top-bar-actions">
            <span id="voice-volume" class="voice-volume">
                <input id="voice-volume-slider" type="range" min="0" max="100" step="5"
                       aria-label="Voice volume" oninput="Voice.setVolume(this.value / 100)">
                <span id="voice-volume-label">100%</span>
            </span>
            <button class="theme-toggle" id="voice-btn" onclick="Voice.toggle()" disabled>… Voice</button>
            <button class="theme-toggle" id="dataset-btn" onclick="toggleDatasetPanel()">Datasets</button>
            <button class="theme-toggle" id="theme-btn" onclick="Theme.toggle()">Light</button>
        </div>
    </div>

    <div id="dataset-panel" class="dataset-panel" style="display:none;">
        <div class="dataset-panel-header">
            <h4>Manage Datasets</h4>
            <button onclick="toggleDatasetPanel()" style="padding:.2rem .5rem; font-size:.8rem;">Close</button>
        </div>
        <div id="dataset-list" class="dataset-list">Loading registry...</div>
    </div>

    <div id="chat-window"></div>
    <div class="input-bar">
        <input type="text" id="input-box" placeholder="Write a message..."
               onkeydown="if(event.key==='Enter')sendMessage()">
        <button onclick="sendMessage()">Send</button>
    </div>

<script>
    // {{CAPTAIN_SOURCE}}

    // {{FLINT_PARSER_SOURCE}}

    // {{FLINT_NPC_SOURCE}}

    // {{NPC_BUNDLE_DATA}}

    // {{DATASET_REGISTRY}}

    /* ───────────────────────── theme ───────────────────────── */
    const CHAT_THEME = {
        dark:  { class: '',           btnText: 'Light', metaColor: '#04090b' },
        light: { class: 'light-mode', btnText: 'Dark',  metaColor: '#f4f7f5' }
    };

    const Theme = {
        apply(name) {
            const cfg = CHAT_THEME[name] || CHAT_THEME.dark;
            document.documentElement.className = cfg.class;
            const btn = document.getElementById('theme-btn');
            if (btn) btn.textContent = cfg.btnText;
            const meta = document.getElementById('theme-color-meta');
            if (meta) meta.setAttribute('content', cfg.metaColor);
            localStorage.setItem('chat-theme', name);
        },
        toggle() {
            this.apply((localStorage.getItem('chat-theme') || 'dark') === 'dark' ? 'light' : 'dark');
        },
        init() { this.apply(localStorage.getItem('chat-theme') || 'dark'); }
    };

    /* ───────────────────────── engine ───────────────────────── */
    const captain = new Captain();
    const npcName = "{{NPC_NAME}}";
    const bot = new FlintNPC(npcName, npcBundleData);
    bot.metadata.username = "LocalWebUser";
    bot.metadata.computer_name = "StandaloneBrowserEnv";

    const win = document.getElementById("chat-window");
    const box = document.getElementById("input-box");
    const currentUsername = localStorage.getItem('npc_context_username') || 'You';

    const escapeHtml = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    const md = s => (window.marked ? marked.parse(String(s ?? "")) : escapeHtml(s));

    /* ───────────────────────── voice ─────────────────────────
       Event-driven detection. No polling, no retry spam.
       States: pending → ready | unavailable                       */
    const Voice = {
        supported: ('speechSynthesis' in window) && ('SpeechSynthesisUtterance' in window),
        state: 'pending',
        enabled: false,
        volume: 1,
        voice: null,
        lang: 'en-US',
        _warned: false,

        init(lang, defaultOn) {
            this.lang = lang || 'en-US';
            const v = parseFloat(localStorage.getItem('npc_voice_volume'));
            this.volume = Number.isFinite(v) ? Math.min(1, Math.max(0, v)) : 1;
            const stored = localStorage.getItem('npc_voice_enabled');
            this.enabled = stored === null ? (defaultOn === true) : stored === '1';

            if (!this.supported) { this._fail(); return; }

            this._probe();
            if (this.state !== 'ready') {
                // Chrome/Brave populate voices asynchronously.
                try { window.speechSynthesis.addEventListener('voiceschanged', () => this._probe()); } catch (e) {}
                // Some engines only expose voices after a user gesture.
                const reprobe = () => { this._probe(); window.removeEventListener('pointerdown', reprobe); };
                window.addEventListener('pointerdown', reprobe, { once: true });
                // Bounded fallback — Brave on Linux often has no speech backend at all.
                setTimeout(() => { if (this.state !== 'ready') this._fail(); }, 3000);
            }
            this.render();
        },

        _fail() {
            this.state = 'unavailable';
            this.enabled = false;
            this.render();
        },

        _probe() {
            if (this.state === 'ready') return;
            let list = [];
            try { list = window.speechSynthesis.getVoices() || []; } catch (e) {}
            if (!list.length) return;
            this.voice = this._pick(list);
            this.state = 'ready';
            this.render();
        },

        _pick(list) {
            const pref = this.lang.slice(0, 2).toLowerCase();
            const inLang = list.filter(v => v.lang && v.lang.toLowerCase().startsWith(pref));
            const pool = inLang.length ? inLang : list;
            const HINTS = ['male','david','guy','mark','james','daniel','george','oliver','matthew','ryan','fred','arthur'];
            return pool.find(v => /\bmale\b/i.test(v.name) && !/female/i.test(v.name))
                || pool.find(v => HINTS.some(k => v.name.toLowerCase().includes(k)))
                || pool[0] || null;
        },

        toggle() {
            if (this.state !== 'ready') return;
            this.enabled = !this.enabled;
            localStorage.setItem('npc_voice_enabled', this.enabled ? '1' : '0');
            if (!this.enabled) this.stop();
            this.render();
        },

        setVolume(v) {
            this.volume = Math.min(1, Math.max(0, Number(v) || 0));
            localStorage.setItem('npc_voice_volume', String(this.volume));
            this.render();
        },

        stop() { try { window.speechSynthesis.cancel(); } catch (e) {} },

        speak(text) {
            if (!this.enabled || this.state !== 'ready' || !text) return;
            const clean = String(text)
                .replace(/```[\s\S]*?```/g, ' code block ')
                .replace(/`[^`]*`/g, '')
                .replace(/\*\*|__|\*|_/g, '')
                .replace(/#+\s/g, '')
                .replace(/\[([^\]]+)\]\([^)]+\)/g, '$1')
                .replace(/<[^>]+>/g, '')
                .replace(/\s+/g, ' ')
                .trim();
            if (!clean) return;
            try {
                window.speechSynthesis.cancel();
                const u = new SpeechSynthesisUtterance(clean);
                u.lang = this.lang;
                u.volume = this.volume;
                u.rate = 1.0;
                if (this.voice) u.voice = this.voice;
                u.onerror = e => this._warnOnce('playback error: ' + (e && e.error));
                window.speechSynthesis.speak(u);
            } catch (e) { this._warnOnce(e); }
        },

        _warnOnce(msg) {
            if (this._warned) return;
            this._warned = true;
            console.warn('[Voice]', msg);
        },

        render() {
            const btn  = document.getElementById('voice-btn');
            const wrap = document.getElementById('voice-volume');
            const slid = document.getElementById('voice-volume-slider');
            const lbl  = document.getElementById('voice-volume-label');
            if (!btn) return;

            if (this.state !== 'ready') {
                btn.disabled = true;
                btn.textContent = this.state === 'pending' ? '… Voice' : '🚫 Voice';
                btn.title = this.state === 'pending'
                    ? 'Detecting speech voices…'
                    : 'No speech synthesis voices available in this browser';
                if (wrap) wrap.style.display = 'none';
                return;
            }
            btn.disabled = false;
            btn.textContent = this.enabled ? '🔊 Voice' : '🔇 Voice';
            btn.title = this.enabled ? 'Voice on — click to mute' : 'Voice off — click to enable';
            if (wrap) wrap.style.display = this.enabled ? 'flex' : 'none';
            if (slid) slid.value = String(Math.round(this.volume * 100));
            if (lbl)  lbl.textContent = Math.round(this.volume * 100) + '%';
        }
    };

    /* ───────────────────────── datasets ───────────────────────── */
    class WebDatasetManager {
        constructor(npcInstance, registryUrl = null, injectedData = null) {
            this.npc = npcInstance;
            this.registryUrl = registryUrl;
            this.availableDatasets = injectedData?.datasets || [];
            this._isLoaded = (injectedData !== null && injectedData !== undefined);
        }
        async loadRegistry() {
            if (this._isLoaded) return this.availableDatasets;
            if (!this.registryUrl) return [];
            try {
                const r = await fetch(this.registryUrl);
                if (!r.ok) throw new Error(`HTTP ${r.status}`);
                const data = await r.json();
                this.availableDatasets = data.datasets || [];
            } catch (e) { console.error("[WebDatasetManager] registry load failed:", e); }
            return this.availableDatasets;
        }
        async toggleDataset(id) {
            const ds = this.availableDatasets.find(d => d.id === id);
            if (!ds) return { success: false, message: "Dataset not found in registry" };
            return this.npc.loaded_datasets.has(id)
                ? this.npc.removeRemoteDataset(id)
                : await this.npc.addRemoteDataset(ds);
        }
        isDatasetActive(id) {
            return this.npc.loaded_datasets.has(id)
                || (this.npc.config.active_datasets || []).includes(id);
        }
    }

    const initialRegistryData = (typeof INJECTED_DATASET_REGISTRY !== 'undefined')
        ? INJECTED_DATASET_REGISTRY : { datasets: [] };
    const datasetManager = new WebDatasetManager(bot, null, initialRegistryData);

    function toggleDatasetPanel() {
        const panel = document.getElementById("dataset-panel");
        const open = panel.style.display === "none" || panel.style.display === "";
        panel.style.display = open ? "flex" : "none";
        if (open) renderDatasets();
    }

    async function renderDatasets() {
        const container = document.getElementById("dataset-list");
        container.innerHTML = "Loading registry...";
        const datasets = await datasetManager.loadRegistry();
        container.innerHTML = "";
        if (!datasets.length) {
            container.innerHTML = "<p style='color:var(--text-dim);font-size:.85rem;'>No additional datasets available.</p>";
            return;
        }
        for (const ds of datasets) {
            const active = datasetManager.isDatasetActive(ds.id);
            const div = document.createElement("div");
            div.className = "dataset-item";
            div.innerHTML = `
                <h5>${escapeHtml(ds.id)} <span style="font-weight:normal;font-size:.75rem;color:var(--text-dim);">${escapeHtml(ds.size || 'Unknown size')}</span></h5>
                <p>${escapeHtml(ds.description || 'No description')}</p>
                <button id="btn-${ds.id}" class="${active ? 'btn-remove' : 'btn-download'}"
                        onclick="handleToggle('${ds.id}')">${active ? 'Remove' : 'Download'}</button>
                <div id="msg-${ds.id}" class="dataset-msg"></div>`;
            container.appendChild(div);
        }
    }

    async function handleToggle(datasetId) {
        const btn = document.getElementById(`btn-${datasetId}`);
        const msg = document.getElementById(`msg-${datasetId}`);
        if (btn) { btn.disabled = true; btn.textContent = "Processing..."; }
        if (msg) { msg.textContent = ""; msg.className = "dataset-msg"; }

        const result = await datasetManager.toggleDataset(datasetId);

        if (msg) {
            msg.textContent = result.message;
            msg.className = `dataset-msg ${result.success ? 'success' : 'error'}`;
        }
        if (btn) btn.disabled = false;
        if (result.success) setTimeout(renderDatasets, 800);
        else if (btn) btn.textContent = datasetManager.isDatasetActive(datasetId) ? "Remove" : "Download";
    }

    /* ───────────────────────── chat ───────────────────────── */
    function showSystemMessage(message) {
        const div = document.createElement("div");
        div.className = "msg intro";
        div.innerHTML = message;
        win.appendChild(div);
        win.scrollTop = win.scrollHeight;
    }

    function resolveContextVars(jsonStr) {
        return String(jsonStr).replace(/\$\(npc_context_(\w+)\)/g, (_m, key) =>
            (localStorage.getItem(`npc_context_${key}`) || '').replace(/"/g, '\\"'));
    }

    async function executeToolChain(toolGroups) {
        if (typeof captain === 'undefined' || !captain || !captain.tools) {
            console.warn("[Captain] not initialised — skipping tool execution.");
            return "";
        }

        let html = "";
        for (const group of (Array.isArray(toolGroups) ? toolGroups : [])) {
            const calls = Array.isArray(group) ? group : (group ? [group] : []);
            for (const call of calls) {
                const name = call.name || (call.function && call.function.name);
                const rawArgs = call.arguments !== undefined
                    ? call.arguments
                    : (call.function ? call.function.arguments : undefined);

                if (!name) { console.warn("[Captain] tool call without a name:", call); continue; }

                const fn = captain.tools[name];
                if (typeof fn !== 'function') {
                    console.warn("[Captain] tool not found:", name);
                    continue;
                }

                let args;
                try {
                    args = (typeof rawArgs === 'string')
                        ? JSON.parse(resolveContextVars(rawArgs))
                        : (rawArgs || {});
                } catch (e) {
                    console.warn(`[Captain] bad tool arguments for '${name}':`, e);
                    continue;
                }

                try {
                    const out = await fn([args]);
                    if (out && out.type === "text") html += `<div>${out.content}</div>`;
                    else if (out && out.type === "html") html += `<div style="margin-top:10px;">${out.content}</div>`;
                } catch (e) {
                    console.error(`[Captain] tool '${name}' failed:`, e);
                }
            }
        }
        return html;
    }

    window.scrollChatToBottom = () => win.scrollTo({ top: win.scrollHeight, behavior: "smooth" });

    async function sendMessage(msg) {
        const text = (msg !== undefined) ? String(msg).trim() : box.value.trim();
        if (!text) return;

        appendMessage(currentUsername, text, "user");
        box.value = "";
        Voice.stop();

        const t0 = performance.now();
        const payload = bot.process_messages(text);
        const responseTime = (performance.now() - t0).toFixed(1);

        // Speak before awaiting tools: keeps the user-activation chain intact.
        Voice.speak(payload.response);

        const toolsHtml = await executeToolChain(payload.tools || []);

        let relatedHtml = "";
        if (payload.status === "rejected" && payload.related && payload.related.length) {
            relatedHtml += `<div class="related-intents" style="margin-top:12px;padding-top:12px;border-top:1px dashed var(--border);">`;
            relatedHtml += `<span style="display:block;font-size:.75rem;color:var(--text-dim);font-weight:650;margin-bottom:8px;text-transform:uppercase;letter-spacing:.05em;">Did you mean?</span>`;
            relatedHtml += `<div style="display:flex;flex-wrap:wrap;gap:8px;">`;
            for (const intent of payload.related) {
                if (!intent.input || !intent.input.length) continue;
                const s = intent.input[0];
                const jsSafe = s.replace(/\\/g,"\\\\").replace(/'/g,"\\'").replace(/"/g,'\\"').replace(/\n/g," ");
                relatedHtml += `<button class="related-btn" onclick="sendMessage('${jsSafe}')">${escapeHtml(s)}</button>`;
            }
            relatedHtml += `</div></div>`;
        }

        const stats = {
            status: payload.status || "rejected",
            confidence: ((payload.confidence || 0) * 100).toFixed(2),
            responseTime
        };

        appendMessage(npcName, payload.response, "npc", payload.emoji, payload.thinking,
                      toolsHtml || "", relatedHtml, stats);
    }

    function appendMessage(sender, text, className, emoji = "😑", thinking = null, html = "", relatedHtml = "", stats = null) {
        const div = document.createElement("div");
        div.className = `msg ${className}`;
        const prefix = escapeHtml(sender.charAt(0).toUpperCase() + sender.slice(1));
        let out = "";

        if (className === "npc") {
            const statsHtml = stats ? `
                <span class="msg-stats">
                    Status: <b>${escapeHtml(stats.status)}</b>
                    Confidence: <b>${stats.confidence}%</b>
                    Response time: <b>${stats.responseTime}ms</b>
                </span>` : "";
            out += `<div class="msg-header"><strong style="color:var(--intro)">${prefix} ${emoji}</strong>${statsHtml}</div>`;
            if (thinking) out += `<div class="thinking">Thinking: ${escapeHtml(thinking)}</div>`;
            out += (text && text.trim())
                ? `<div class="markdown-body">${md(text)}</div>`
                : `<div class="markdown-body">I'm not quite sure I understand, but perhaps one of these is what you're looking for:</div>`;
        } else {
            out += `<div class="markdown-body"><strong style="color:var(--intro)">${prefix}</strong> ${md(text)}</div>`;
        }
        if (html) out += `<div style="margin-top:10px;">${html}</div>`;
        if (relatedHtml) out += relatedHtml;

        div.innerHTML = out;
        win.appendChild(div);
        scrollChatToBottom();
    }

    /* ───────────────────────── auto-load ───────────────────────── */
    async function autoLoadDatasetsOnStart() {
        const targets = bot.config.active_datasets || [];
        if (!targets.length) return;

        const popup = document.getElementById("loading-popup");
        const bar   = document.getElementById("loading-progress");
        const stat  = document.getElementById("loading-status");
        const title = document.getElementById("loading-title");

        popup.style.display = "flex";
        bar.style.width = "0%";
        bar.style.background = "var(--primary-background, #4caf50)";
        stat.textContent = "Initializing...";

        try {
            bar.style.width = "10%"; stat.textContent = "Connecting to registry...";
            const registry = await datasetManager.loadRegistry();
            bar.style.width = "20%"; stat.textContent = "Registry loaded.";
            await new Promise(r => setTimeout(r, 100));

            const step = 60 / targets.length;
            for (let i = 0; i < targets.length; i++) {
                const id = targets[i];
                if (bot.loaded_datasets.has(id)) continue;
                const ds = registry.find(d => d.id === id);
                if (!ds) { console.warn(`[AutoLoad] '${id}' not in registry, skipping.`); continue; }

                const p = 20 + i * step;
                bar.style.width = `${p}%`;
                stat.textContent = `Loading dataset ${i + 1}/${targets.length}: '${id}'...`;
                const res = await bot.addRemoteDataset(ds);
                if (!res.success) console.error(`[AutoLoad] '${id}' failed: ${res.message}`);

                bar.style.width = `${p + step / 2}%`;
                stat.textContent = `Rebuilding engine for '${id}'...`;
                await new Promise(r => setTimeout(r, 300));
            }

            bar.style.width = "100%";
            stat.textContent = "Complete!";
            title.textContent = "Datasets Loaded Successfully";
            setTimeout(() => {
                popup.style.display = "none";
                const n = targets.filter(id => bot.loaded_datasets.has(id)).length;
                showSystemMessage(`Automatically loaded ${n} dataset(s) from config.`);
            }, 600);
        } catch (error) {
            console.error("[AutoLoad] Failed:", error);
            bar.style.width = "100%";
            bar.style.background = "var(--user, #e5534b)";
            stat.textContent = `Error: ${error.message}`;
            title.textContent = "Loading Failed";
            setTimeout(() => {
                popup.style.display = "none";
                showSystemMessage(`⛔ Failed to auto-load datasets: ${escapeHtml(error.message)}`);
            }, 2500);
        }
    }

    /* ───────────────────────── boot ───────────────────────── */
    window.addEventListener("DOMContentLoaded", () => {
        Theme.init();
        Voice.init(bot.config.lang, bot.config.tts === true);
        showSystemMessage(`Chat with <strong>${escapeHtml(npcName.toUpperCase())}</strong> is now <strong>READY</strong>.`);
        autoLoadDatasetsOnStart();
    });
</script>
</body>
</html>
